[project]
name = "py-theatre-api"
version = "0.1.0"
description = "Theatre API - RESTful backend for browsing performances and reserving tickets"
authors = [
    {name = "matweyes"}
]
readme = "README.md"
requires-python = "^3.12"
dependencies = [
    "django (>=6.0.7,<7.0.0)",
    "djangorestframework (>=3.17.1,<4.0.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "drf-spectacular (>=0.30.0,<0.31.0)",
    "django-debug-toolbar (>=7.0.0,<8.0.0)",
    "psycopg[binary] (>=3.3.4,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "flake8 (>=7.3.0,<8.0.0)",
    "flake8-quotes (>=3.4.0,<4.0.0)",
    "flake8-variables-names (>=0.0.6,<0.0.7)",
    "pep8-naming (>=0.15.1,<0.16.0)"
]
