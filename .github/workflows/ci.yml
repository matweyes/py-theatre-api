name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry==2.3.1

      - name: Install dependencies
        run: poetry install --only dev --no-root --no-interaction

      - name: Run flake8
        run: poetry run flake8

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: theatre
          POSTGRES_USER: theatre
          POSTGRES_PASSWORD: theatre
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U theatre"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_DB: theatre
      POSTGRES_USER: theatre
      POSTGRES_PASSWORD: theatre
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry==2.3.1

      - name: Install dependencies
        run: poetry install --no-root --no-interaction

      - name: Run migrations
        run: poetry run python manage.py migrate --no-input

      - name: Run tests
        run: poetry run python manage.py test --verbosity=2
